version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/deicod/gotodon

linters-settings:
  misspell:
    locale: US

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
